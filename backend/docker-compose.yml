services:
  postgres:
    image: postgres:16
    container_name: eliud-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eliuddb}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - eliud-pgdata:/var/lib/postgresql/data

volumes:
  eliud-pgdata:
