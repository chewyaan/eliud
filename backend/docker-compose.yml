services:
  postgres:
    image: postgres:16
    container_name: eliud-postgres
    environment:
      POSTGRES_DB: eliuddb
      POSTGRES_USER: chewyaan
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"
    volumes:
      - eliud-pgdata:/var/lib/postgresql/data

volumes:
  eliud-pgdata:
