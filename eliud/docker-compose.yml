services:
  postgres:
    image: postgres:16
    container_name: eliud-postgres
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5433:5432"
    volumes:
      - eliud-pgdata:/var/lib/postgresql/data

volumes:
  eliud-pgdata:
